services:
  db:
    image: mariadb:10.11
    container_name: lscda-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lscda}
      MYSQL_USER: ${MYSQL_USER:-lscda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lscda_password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    container_name: lscda-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-lscda}:${MYSQL_PASSWORD:-lscda_password}@db:3306/${MYSQL_DATABASE:-lscda}
    entrypoint: ["sh", "-c", "corepack enable && pnpm db:push"]
    profiles: ["migrate"]

  app:
    build:
      context: .
      target: runner
    container_name: lscda-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3050
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-lscda}:${MYSQL_PASSWORD:-lscda_password}@db:3306/${MYSQL_DATABASE:-lscda}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3050"

volumes:
  db_data:
